name: Linux

on: [push]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        options: [--with-sb-thread, --without-sb-thread, --without-sb-unicode]
        arch: [x86, x86-64]
        subfeatures: ['']
        include:
          - { arch: x86-64, subfeatures: sse4, options: --with-sb-thread --with-nonstop-foreign-call }
          - { arch: x86-64, subfeatures: fasteval, options: --with-sb-fasteval --without-sb-eval --with-nonstop-foreign-call }
          - { arch: x86-64, options: --with-mark-region-gc --with-nonstop-foreign-call }
          - { arch: x86-64, options: --with-nonstop-foreign-call }

      fail-fast: false

    steps:
    - uses: actions/checkout@v1
    - name: install host sbcl
      run: |
        sudo apt-get -qq update | true
        sudo apt-get -qq install libcapstone-dev libzstd-dev
        cd /tmp/
        wget -q https://github.com/sbcl/sbcl/releases/download/sbcl-1.4.14/sbcl-2.4.8-x86-64-linux-binary.tar.bz2
        tar xf sbcl-2.4.8-x86-64-linux-binary.tar.bz2
        cd sbcl-2.4.8-x86-64-linux/
        sudo ./install.sh
    - name: install host gcc-multilib
      if: matrix.arch == 'x86'
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get -qq update | true
        sudo apt-get -qq --no-install-recommends install gcc-multilib libzstd-dev:i386
        sudo sysctl -w vm.mmap_rnd_compat_bits=8

    - name: backend-sub-features
      if: matrix.subfeatures == 'sse4'
      run: echo '(lambda (features) (list* :popcnt :sse4 features))' > customize-backend-subfeatures.lisp

    - name: build
      env:
        SBCL_MAKE_TARGET_2_OPTIONS: --disable-ldb --disable-debugger
      run: |
        ./make.sh ${{ matrix.options }} --with-sb-core-compression \
            --xc-host='sbcl --dynamic-space-size 700MB \
            --lose-on-corruption --disable-ldb --disable-debugger' \
            --arch=${{ matrix.arch }}

    - name: test-fasteval
      if: matrix.subfeatures == 'fasteval'
      run: cd tests; ./run-tests.sh --evaluator-mode interpret
    - name: test
      run: cd tests; ./run-tests.sh --slow
    - name: ansi-test
      run: cd tests; ./ansi-tests.sh

    - name: crossbuild arm
      if: matrix.subfeatures == 'sse4'
      run: ./build-all-cores.sh -j 1 arm
    - name: crossbuild arm64
      if: matrix.subfeatures == 'sse4'
      run: ./build-all-cores.sh -j 1 arm64
    - name: crossbuild mips
      if: matrix.subfeatures == 'sse4'
      run: ./build-all-cores.sh -j 1 mips
    - name: crossbuild ppc
      if: matrix.subfeatures == 'sse4'
      run: ./build-all-cores.sh -j 1 ppc
    - name: crossbuild ppc64
      if: matrix.subfeatures == 'sse4'
      run: ./build-all-cores.sh -j 1 ppc64
    - name: crossbuild riscv
      if: matrix.subfeatures == 'sse4'
      run: ./build-all-cores.sh -j 1 riscv
    - name: crossbuild sparc
      if: matrix.subfeatures == 'sse4'
      run: ./build-all-cores.sh -j 1 sparc
    - name: crossbuild loongarch64
      if: matrix.subfeatures == 'sse4'
      run: ./build-all-cores.sh -j 1 loongarch64
    - name: crossbuild x86
      if: matrix.subfeatures == 'sse4'
      run: ./build-all-cores.sh -j 1 x86
    - name: crossbuild x86-64
      if: matrix.subfeatures == 'sse4'
      run: ./build-all-cores.sh -j 1 x86-64

    # Our tests passed. Let others get at this version.
    - name: package binary
      # if: github.ref == 'refs/heads/master'
      run: |
        FEATURES_NAME="${{ matrix.features-name }}"
        if [ -z "$FEATURES_NAME" ]; then
            FEATURES_NAME="${{ matrix.options }}"
            if [ ! -z "${{ matrix.subfeatures }}" ]; then
                FEATURES_NAME="$FEATURES_NAME_${{ matrix.subfeatures}}"
            fi
            FEATURES_NAME="$(echo "$FEATURES_NAME" | sed 's/[^a-zA-Z0-9]/-/g')"
        fi
        FILENAME="sbcl_${{ runner.os }}_${{ matrix.arch }}_${FEATURES_NAME}_latest-dev_bin.tar"
        # Downcase it
        FILENAME="${FILENAME,,}"
        cd ..
        mv sbcl sbcl-latest-dev
        sbcl-latest-dev/binary-distribution.sh sbcl-latest-dev
        mv sbcl-latest-dev sbcl
        mv sbcl-latest-dev-binary.tar "$FILENAME"
        # Store this name for the next step (upload/release)
        echo "BINARY_PATH=../$FILENAME" >> $GITHUB_ENV

    - name: update latest-dev release
      # if: github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      # Prevents a failing upload from failing the whole build
      continue-on-error: true
      with:
        name: "SBCL latest-dev builds"
        # The argument tag_name is required. This is a rolling
        # release, but softprops/action-gh-release@v2 does not move
        # the tag (although it updates the files), which is just as
        # well, as moving the tag would lead to races between tag and
        # file updates. To keep confusion to a minimum, we create a
        # "latest-dev" tag manually that references an empty commit:
        #
        #     TREE_ID=$(git hash-object -t tree /dev/null)
        #     COMMIT_ID=$(git commit-tree $TREE_ID -m "Empty tree for latest-dev, a rolling release")
        #     git tag moving-target $COMMIT_ID
        #     git push origin latest-dev
        #
        # The actual version for any individual binary tarball can be
        # determined by running its SBCL and evaluating
        # (LISP-IMPLEMENTATION-VERSION) in it.
        tag_name: latest-dev
        prerelease: true
        files: ${{ env.BINARY_PATH }}
